<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Employee Registration</title>
</head>

<body>

<h1>Employee Registration</h1>

<form action="/employees/register" method="post">

    <label>
        Name:
        <input type="text" name="name" required>
    </label>

    <br><br>

    <label>
        Department:
        <input type="text" name="department" required>
    </label>

    <br><br>

    <label>
        Salary:
        <input type="number"
               name="salary"
               step="0.01"
               required>
    </label>

    <br><br>

    <button type="submit">
        Register Employee
    </button>

</form>

</body>

</html>
